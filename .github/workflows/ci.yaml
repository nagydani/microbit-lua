name: CI

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'doc/**'

  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build-linux-amd64:
    name: "linux x86_64"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/attila-lendvai/microbit-ci:amd64
      options: --init

    steps:
      - name: System info
        run: |
          echo "===== OS Info ====="
          uname -a
          sw_vers || lsb_release -a || cat /etc/os-release || true
          echo "===== CPU Info ====="
          uname -m
          sysctl -n machdep.cpu.brand_string || lscpu || true
          echo "===== Environment ====="
          env

      # The checkout belongs to the runner's user, not the container's, and
      # git refuses to read it otherwise: build.py asks git for the
      # firmware's version.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - run:  arm-none-eabi-gcc --version

      - run:  ./build.py

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: MicroBit firmware
          path: |
            MICROBIT.*

      - name: Run hextract tests
        run: bash tests/hextract-tests.sh
